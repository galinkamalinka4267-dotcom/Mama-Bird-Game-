<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>МАМА ПТИЦА: Параллельное Измерение</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab, #4a00e0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .portal-container {
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 234, 0, 0.4);
            border-radius: 24px;
            padding: 25px 20px;
            width: 100%;
            max-width: 480px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(255, 234, 0, 0.25);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            margin: 10px 0;
            color: #ffea00;
            text-shadow: 0 0 15px rgba(255, 234, 0, 0.8);
        }

        .dimension-badge {
            background: #ffea00;
            color: #000000;
            font-weight: bold;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(255, 234, 0, 0.5);
        }

        .dimension-image {
            width: 220px;
            height: 220px;
            margin: 15px 0;
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            border: 3px solid #ffea00;
            box-shadow: 0 0 25px rgba(255, 234, 0, 0.5);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.98); box-shadow: 0 0 15px rgba(255, 234, 0, 0.4); }
            100% { transform: scale(1.02); box-shadow: 0 0 35px rgba(255, 234, 0, 0.8); }
        }

        .description {
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .back-btn {
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            outline: none;
        }

        .back-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 65, 108, 0.6);
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="dimension-badge">Секретная локация</div>
        <h1>Жёлтое Измерение</h1>

        <div class="dimension-image" style="background-image: url('level26.png');"></div>

        <p class="description">
            Вы активировали секретную комбинацию в сетке крафта и прошли сквозь портал! Все ваши клики, персонажи и achievements сохранены в вашем измерении.
        </p>

        <button class="back-btn" onclick="window.location.href='index.html'">
            ⬅ Вернуться к маме птице
        </button>
    </div>

</body>
</html>
