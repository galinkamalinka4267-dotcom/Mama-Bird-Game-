<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Параллельное Измерение</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #11111d;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 2.2rem;
            color: #ffcc00;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
            margin-bottom: 10px;
        }

        .back-btn {
            background: #a855f7;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
            transition: transform 0.1s, background 0.2s;
        }

        .back-btn:hover {
            background: #9333ea;
            transform: scale(1.03);
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ffcc00;
            border-radius: 16px;
            padding: 15px 30px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
            width: 100%;
        }

        .score-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .click-area {
            position: relative;
            margin-bottom: 30px;
        }

        /* Зеркалим птицу по горизонтали через scaleX(-1) */
        .bird-img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.08s ease;
            filter: drop-shadow(0 0 15px rgba(255, 204, 0, 0.3));
            transform: scaleX(-1); 
        }

        .bird-img:active {
            transform: scaleX(-1) scale(0.92);
        }

        .click-pop {
            position: absolute;
            color: #ffcc00;
            font-weight: bold;
            font-size: 1.8rem;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.2);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">🟡 Параллельное Измерение</h1>
        <button class="back-btn" onclick="window.location.href='index.html'">
            🟣 Вернуться в Фиолетовый Мир
        </button>
    </div>

    <div class="main-container">
        <div class="score-box">
            <div class="score-value" id="score">0</div>
        </div>

        <div class="click-area" id="click-area">
            <img src="level7.png" alt="Bird" class="bird-img" id="bird">
        </div>
    </div>

    <script>
        // Сохранение полностью отключено: при перезагрузке счёт всегда 0
        let score = 0;
        const scoreEl = document.getElementById('score');
        const bird = document.getElementById('bird');
        const clickArea = document.getElementById('click-area');

        function updateScoreDisplay() {
            scoreEl.textContent = score;
        }

        bird.addEventListener('click', (e) => {
            score++;
            updateScoreDisplay();

            const pop = document.createElement('div');
            pop.className = 'click-pop';
            pop.textContent = '+1';
            
            const rect = clickArea.getBoundingClientRect();
            const x = e.clientX - rect.left - 15;
            const y = e.clientY - rect.top - 20;

            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;

            clickArea.appendChild(pop);

            setTimeout(() => {
                pop.remove();
            }, 800);
        });

        updateScoreDisplay();
    </script>
</body>
</html>
